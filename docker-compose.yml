version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakenix-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - HOST=0.0.0.0
      - DEMO_MODE=true
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SECRET_KEY=docker-compose-dev-secret-key-32chars-min
      - JWT_SECRET_KEY=docker-compose-jwt-secret-key-32chars-min
      - GROQ_MODEL=qwen/qwen3.8-27b
      - DATABASE_URL=sqlite:///storage/fakenix_dev.db
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
